workflows:
  android-release:
    name: Android Play Store Release
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - android_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.ahmedapps.dhakalocalbus"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build release AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1) \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: true
      email:
        recipients:
          - ahmedappsbd@gmail.com
        notify:
          success: true
          failure: true
