workflows:
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - android_keystore
      vars:
        PACKAGE_NAME: "com.ahmedapps.dhakalocalbus"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build release AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1) \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  android-apk:
    name: Android APK (Direct Install)
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - android_keystore
      vars:
        PACKAGE_NAME: "com.ahmedapps.dhakalocalbus"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK
        script: |
          flutter build apk \
            --release \
            --build-name=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1) \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - ahmedappsbd@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.dhakalocalbus
      vars:
        BUNDLE_ID: "com.example.dhakalocalbus"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build iOS release
        script: |
          flutter build ipa \
            --release \
            --build-name=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1) \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ahmedappsbd@gmail.com
        notify:
          success: true
          failure: true
