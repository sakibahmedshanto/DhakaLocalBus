workflows:
  android-release:
    name: Android Play Store Release
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - google_play
        - android_signing
      vars:
        PACKAGE_NAME: "com.ahmedapps.dhakalocalbus"
    scripts:
      - name: Set up key.properties
        script: |
          echo "storePassword=$CM_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=/Users/builder/.keystores/upload-keystore.jks" >> android/key.properties
          echo "$CM_KEYSTORE" | base64 --decode > /Users/builder/.keystores/upload-keystore.jks
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build release AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1) \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: true
      email:
        recipients:
          - ahmedappsbd@gmail.com
        notify:
          success: true
          failure: true
